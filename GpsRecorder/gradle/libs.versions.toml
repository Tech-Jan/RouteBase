[versions]
agp = "9.1.0"  # max supported by stable Android Studio Quail 2; 9.3 needs Canary IDE
# No `kotlin` version here on purpose: the kotlin-android plugin is applied nowhere, so Kotlin rides on
# AGP's built-in toolchain and follows `agp`. A pinned-but-unused version made the catalog lie (a "Kotlin
# bump" edit here changed nothing while the real Kotlin moved with AGP).
ksp = "2.3.10"
coreKtx = "1.18.0"  # 1.19.0 requires compileSdk 37; hold until we move the SDK platform
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
playServicesLocation = "21.4.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
room = "2.8.4"
coroutines = "1.11.0"
lifecycle = "2.11.0"
work = "2.11.2"
junit = "4.13.2"
dependencyCheck = "12.2.2"
detekt = "1.23.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
