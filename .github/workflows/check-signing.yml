# Manual sanity check of the Android signing secrets (Actions → "Check Android signing secrets" → Run workflow).
# Prints only what is safe to show — secret length, decoded size, a short SHA-256 prefix, the first bytes — so it can
# be compared with the local keystore, then proves store password + alias with keytool. Compare locally with:
#   base64 -w0 ~/routebase-release.jks | wc -c;  stat -c %s ~/routebase-release.jks;  sha256sum ~/routebase-release.jks
name: Check Android signing secrets

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'Tech-Jan/RouteBase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Decode and open the keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/check.jks"
          echo "secret: ${#KEYSTORE_B64} chars (whitespace in it: $(printf '%s' "$KEYSTORE_B64" | tr -cd '[:space:]' | wc -c))"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$ks"
          echo "decoded: $(stat -c %s "$ks") bytes, sha256 $(sha256sum "$ks" | cut -c1-16)…, first bytes: $(head -c 4 "$ks" | od -An -tx1)"
          echo "(a PKCS12 keystore starts with: 30 82)"
          keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias routebase | grep -iE 'routebase|entry|error' \
            || { echo "::error::keytool could not open the keystore with that password/alias"; exit 1; }
          rm -f "$ks"
